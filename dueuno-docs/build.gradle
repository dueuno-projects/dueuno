plugins {
    id "dueuno-asciidoctor"
}

asciidoctor {
    attributes "api-partials-dir": file("src/docs/asciidoc/partials/api-reference").absolutePath
    sources {
        include "**/*.adoc"
        exclude "partials/**"
    }
}

