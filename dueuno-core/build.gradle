plugins {
    id "dueuno-plugin"
}

dependencies {
    api project(":commons-utils")

    // Shared browser libraries, including production asset compilation.
    runtimeOnly "org.webjars.npm:jquery"
    runtimeOnly "org.webjars.npm:bootstrap"

    // Design by Contract support
    api "org.apache.groovy:groovy-contracts"

    // Security (to use the @Secured annotation)
    api "org.apache.grails:grails-spring-security:${grailsVersion}"

    // Quartz (to schedule jobs when no Scheduler solution is in use)
    api "org.apache.grails:grails-quartz:${grailsVersion}"

    // Websockets
    api "org.springframework:spring-messaging"
    implementation "org.springframework:spring-websocket"

    // System monitoring
    implementation "net.bull.javamelody:javamelody-spring-boot4-starter:2.9.0"

    // Database drivers
    runtimeOnly "com.h2database:h2:2.5.252"
    runtimeOnly "com.mysql:mysql-connector-j:26.10.0"
    runtimeOnly "org.postgresql:postgresql:42.7.14"
    runtimeOnly "com.microsoft.sqlserver:mssql-jdbc:13.6.2.jre11"
    runtimeOnly "com.oracle.database.jdbc:ojdbc11:23.26.4.0.0"
    runtimeOnly "com.ibm.db2:jcc:12.1.5.0"
    runtimeOnly "com.sap.cloud.db.jdbc:ngdbc:2.30.11"
}

// Browser tests use the same WebJars as the application, resolved by the Grails BOM.
def javaScriptTestAssets = layout.buildDirectory.dir("javascript-test-assets")

tasks.register("prepareJavaScriptTestAssets", Sync) {
    from({
        configurations.runtimeClasspath.findAll {
            it.name ==~ /(?:jquery|bootstrap)-[0-9].*\.jar/
        }.collect { zipTree(it) }
    })
    include "META-INF/resources/webjars/**"
    into javaScriptTestAssets
}

tasks.register("javascriptWebjarTest", Exec) {
    dependsOn "prepareJavaScriptTestAssets"
    environment "DUEUNO_TEST_WEBJARS", javaScriptTestAssets.get().asFile.absolutePath
    commandLine "node", "--test", "src/test/javascript/ButtonDropdown.test.cjs"
}
