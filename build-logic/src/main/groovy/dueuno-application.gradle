plugins {
    id "groovy"
    id "org.apache.grails.gradle.grails-web"
    id "org.apache.grails.gradle.grails-gsp"
    id "cloud.wondrify.asset-pipeline"
    id "dueuno-asciidoctor"
    id "eclipse"
    id "idea"
}

group = projectGroup
version = projectVersion

repositories {
    //mavenLocal()
    mavenCentral()
    maven {
        url = 'https://repo.grails.org/grails/restricted'
    }
    maven {
        url = 'https://repository.apache.org/content/groups/snapshots'
        content {
            includeVersionByRegex('org[.]apache[.]grails.*', '.*', '.*-SNAPSHOT')
        }
        content {
            includeVersionByRegex('org[.]apache[.]groovy.*', 'groovy.*', '.*-SNAPSHOT')
        }
        mavenContent {
            snapshotsOnly()
        }
    }
    maven {
        url = 'https://central.sonatype.com/repository/maven-snapshots'
        content {
            includeVersionByRegex('org[.]sitemesh.*', '.*', '.*')
        }
        mavenContent {
            snapshotsOnly()
        }
    }
    maven {
        url = 'https://repository.apache.org/content/groups/staging'
        content {
            includeVersionByRegex('org[.]apache[.]grails[.]gradle', 'grails-publish', '.*')
        }
        content {
            includeVersionByRegex('org[.]apache[.]groovy.*', 'groovy.*', '.*')
        }
        mavenContent {
            releasesOnly()
        }
    }
}

dependencies {
    profile "org.apache.grails.profiles:web"
    testAndDevelopmentOnly "org.webjars.npm:bootstrap"
    testAndDevelopmentOnly "org.webjars.npm:bootstrap-icons"
    testAndDevelopmentOnly "org.webjars.npm:jquery"
    implementation platform("org.apache.grails:grails-bom:$grailsVersion")
    implementation "org.apache.grails:grails-core"
    implementation "org.apache.grails:grails-data-hibernate5"
    implementation "org.apache.grails:grails-databinding"
    implementation "org.apache.grails:grails-events"
    implementation "org.apache.grails:grails-gsp"
    implementation "org.apache.grails:grails-interceptors"
    implementation "org.apache.grails:grails-logging"
    implementation "org.apache.grails:grails-rest-transforms"
    implementation "org.apache.grails:grails-scaffolding"
    implementation "org.apache.grails:grails-services"
    implementation "org.apache.grails:grails-sitemesh3"
    implementation "org.apache.grails:grails-url-mappings"
    implementation "org.apache.grails:grails-web-boot"
    implementation "org.springframework.boot:spring-boot-autoconfigure"
    implementation "org.springframework.boot:spring-boot-starter"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-logging"
    implementation "org.springframework.boot:spring-boot-starter-tomcat"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-tomcat"
    runtimeOnly "cloud.wondrify:asset-pipeline-grails"
    runtimeOnly "com.h2database:h2"
    runtimeOnly "com.zaxxer:HikariCP"
    integrationTestImplementation testFixtures("org.apache.grails:grails-geb")
    testImplementation "org.apache.grails:grails-testing-support-datamapping"
    testImplementation "org.apache.grails:grails-testing-support-web"
    testImplementation "org.mockito:mockito-core"
    testImplementation "org.spockframework:spock-core"
}

// Spock 2.4-groovy-5.0 (managed by grails-bom while a Groovy 6-compatible
// Spock artifact is unreleased) refuses to load its compiler AST transform
// against Groovy 6 with IncompatibleGroovyVersionException. The runtime
// effect of this check is just a guard, so opt out on both the
// GroovyCompile classpath (where Spock's AST transform runs) and the Test
// JVM (where BeanBuilder.loadBeans() and similar compile Groovy at
// runtime). The flag is a no-op when Spock and Groovy major versions
// match, so it is safe to always set; remove this block once grails-bom
// pins a Spock artifact whose Groovy major matches groovy.version.
tasks.withType(GroovyCompile).configureEach {
    options.forkOptions.jvmArgs = (options.forkOptions.jvmArgs ?: []) + ['-Dspock.iKnowWhatImDoing.disableGroovyVersionCheck=true']
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'spock.iKnowWhatImDoing.disableGroovyVersionCheck', 'true'
}

assets {
    minifyOptions = [
            //SIMPLE (default) or ADVANCED or WHITESPACE_ONLY
            optimizationLevel: "SIMPLE",
    ]
    excludes = [
            'webjars/**',
    ]
}
