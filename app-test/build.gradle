plugins {
    id "dueuno-application"
}

repositories {
    //mavenLocal()
    mavenCentral()
    maven {
        url = 'https://repo.grails.org/grails/restricted'
    }
    maven {
        url = 'https://repo.grails.org/grails/restricted'
    }
    maven {
        url = 'https://repository.apache.org/content/groups/snapshots'
        content {
            includeVersionByRegex('org[.]apache[.]grails.*', '.*', '.*-SNAPSHOT')
        }
        content {
            includeVersionByRegex('org[.]apache[.]groovy.*', 'groovy.*', '.*-SNAPSHOT')
        }
        mavenContent {
            snapshotsOnly()
        }
    }
    maven {
        url = 'https://central.sonatype.com/repository/maven-snapshots'
        content {
            includeVersionByRegex('org[.]sitemesh.*', '.*', '.*')
        }
        mavenContent {
            snapshotsOnly()
        }
    }
    maven {
        url = 'https://repository.apache.org/content/groups/staging'
        content {
            includeVersionByRegex('org[.]apache[.]grails[.]gradle', 'grails-publish', '.*')
        }
        content {
            includeVersionByRegex('org[.]apache[.]groovy.*', 'groovy.*', '.*')
        }
        mavenContent {
            releasesOnly()
        }
    }
}

dependencies {
    implementation project(":dueuno-core")
    implementation project(":dueuno-extra")

    // Spring Boot DevTools may cause performance slowdowns or compatibility issues on larger applications
    developmentOnly "org.springframework.boot:spring-boot-devtools"

}

bootRun {
    jvmArgs(
            "-Xms2g",
            "-Xmx2g",
    )
}

configurations.all {
    resolutionStrategy {
        cacheChangingModulesFor 0, "seconds"
    }
}

assets {
    skipNonDigests = true
    minifyCss = true
    minifyJs = true
    minifyOptions = [
            //SIMPLE (default) or ADVANCED or WHITESPACE_ONLY
            optimizationLevel: "SIMPLE",
            excludes: ["**/libs/**"]
    ]
}
