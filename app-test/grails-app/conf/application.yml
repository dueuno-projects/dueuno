#        key-store-password: KeyStorePassword
#        key-alias: tomcat

---

grails:
  plugin:
    springsecurity:
      providerNames:
        - runtimeAuthenticationProvider

---
grails:
  codegen:
    defaultPackage: test.app
  profile: web
  views:
    gsp:
      encoding: UTF-8
      htmlcodec: xml
      codecs:
        scriptlet: html

---
spring:
  threads:
    virtual:
      enabled: true
  h2:
    console:
      enabled: true
  servlet:
    multipart:
      maxFileSize: 20MB
      maxRequestSize: 20MB

---
hibernate:
  cache:
    queries: false
    use_second_level_cache: false
    use_query_cache: false

# Create DB with:
# CREATE DATABASE database_name CHARACTER SET utf8 COLLATE utf8_general_ci;

# Create USER with:
# CREATE USER myuser@localhost IDENTIFIED BY 'MyPassword';
# GRANT ALL ON *.* TO myuser@localhost;
dataSource:
  pooled: true
  jmxExport: true
  driverClassName: com.mysql.cj.jdbc.Driver

  url: jdbc:mysql://localhost:3306/g8_dueuno?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
  username: root
  password: root

environments:

  development:
    dataSource:
      dbCreate: update

  test:
    dataSource:
      dbCreate: update

  production:
    dataSource:
      dbCreate: update
