info.app.name: app-test
info:
  app:
    name: '@info.app.name@'
    version: '@info.app.version@'
    grailsVersion: '@info.app.grailsVersion@'

logging:
  level:
    root: ERROR
    org.springframework.boot.SpringApplication: INFO
    dueuno: DEBUG
    apptest: TRACE
    # dueuno.commons.utils.SqlUtils: TRACE
    # dueuno.ImportUtils: TRACE
    # org.grails.datastore: DEBUG
    # org.hibernate.SQL: DEBUG
    # org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    # org.springframework.security: DEBUG
    # grails.plugin.springsecurity.web.filter.DebugFilter: INFO
    # sun.net.www.protocol.http.HttpURLConnection: ALL
  file:
    name: ${info.app.name}/logs/${info.app.name}.log
  logback:
    rollingpolicy:
      file-name-pattern: ${info.app.name}/logs/archive/${info.app.name}.%d{yyyy-MM-dd}.%i.log.zip
      clean-history-on-start: true
      max-history: 10
      max-file-size: 10MB
      total-size-cap: 100GB
  pattern:
    # Logback uses its default foreground for TRACE and DEBUG; map it to dark gray and keep INFO default.
    console: "\u001B[90m%d{HH:mm:ss.SSS}\u001B[39m %replace(%replace(%replace(%highlight(%-5level)){'\\u001B\\[31m','\u001B[33m'}){'\\u001B\\[(0;)?39m','\u001B[90m'}){'\\u001B\\[34m','\u001B[39m'} \u001B[90m[%thread]\u001B[39m \u001B[90m%-40.40logger{36}\u001B[39m \u001B[90m:\u001B[39m %replace(%replace(%replace(%highlight(%msg%n)){'\\u001B\\[31m','\u001B[33m'}){'\\u001B\\[(0;)?39m','\u001B[90m'}){'\\u001B\\[34m','\u001B[39m'}"
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %-40.40logger{36} : %msg%n'

# ===================================================
# SSL CONSIGURATION
# ===================================================
#
# CREATE DEV CERTIFICATE
# cd ${project-dir}/src/main/resources/certificates
# openssl req -x509 -newkey rsa:4096 -keyout dev-key.pem -out dev-cert.pem -days 3650 -subj '/CN=localhost'
# openssl pkcs12 -export -in dev-cert.pem -inkey dev-key.pem -out dev-keystore.p12 -name tomcat -caname root
#
# IMPORTANT: You may give "always trust" permissions to the certificate "certificates/dev-cert.pem" in your
# operating system specific Keychain Tool to be able to visit the website
#
# NOTE: Comment all HTTPS configuration to start in HTTP only
#
environments:
  development:
    server:
      port: 9443
      port-http: 9080
      servlet:
        context-path: /apptest
        session:
          persistent: true
          store-dir: app-test
      ssl:
        enabled: true
        key-store-type: PKCS12
        key-store: classpath:certificates/dev-keystore.p12
        key-store-password: password
        key-alias: tomcat

# CREATE PRODUCTION CERTIFICATE
# See: https://certbot.eff.org/en/instructions
#
#  production:
