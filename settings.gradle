pluginManagement {
    repositories {
        maven {
            url = 'https://repository.apache.org/content/groups/snapshots'
            content {
                includeGroupByRegex('org[.]apache[.]grails.*')
                includeGroupByRegex('org[.]apache[.]groovy.*')
            }
            mavenContent {
                snapshotsOnly()
            }
        }
        gradlePluginPortal()
    }
    includeBuild("build-logic")
}

rootProject.name = projectName

include "commons-utils"
include "dueuno-core"
include "dueuno-extra"

include "dueuno-docs"
//include "dueuno-docs-app"

include "app-test"
